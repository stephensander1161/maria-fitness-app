# Dependency updates, weekly, grouped — one pull request for the routine
# minor/patch bumps, separate ones for anything major, and security advisories
# whenever they land. They open against dev, because dev gates production:
# a bump goes through the same gates as any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
