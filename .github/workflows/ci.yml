name: CI

# Every change to main is checked before it can be deployed. This is the
# change-management control: nothing reaches her app without the type checker,
# the linter, the full test suite and a dependency audit having passed.
on:
  push:
    branches: [main]
  pull_request:
  # Dependencies rot even when the code doesn't — catch a new advisory in a
  # package we already shipped.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the development runtime: npm 10 and npm 11 resolve optional
          # platform dependencies differently, and a lockfile written by one
          # fails `npm ci` under the other.
          node-version: 24
          cache: npm

      # `ci` not `install`: installs exactly the locked tree, and fails if the
      # lockfile and manifest disagree.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # No database, no API key: the suite is pure logic by design, and this
      # job proves it stays that way.
      - name: Tests
        run: npm test

      - name: Dependency audit (production)
        # npm's advisory endpoint is flaky, and it takes the whole pipeline
        # down with it: two runs in one evening failed here, one on ECONNRESET
        # and one on a read timeout, neither of them a vulnerability. A gate
        # that goes red for reasons unrelated to the change is a gate people
        # learn to ignore, which costs more than the flake does.
        #
        # So: retry a network error, and never let one read as a clean audit.
        # A real finding still fails on the first attempt — the retry only
        # applies to the handful of errors that mean "could not ask".
        run: |
          unreachable='ECONNRESET|network timeout|audit endpoint returned an error|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|socket hang up'
          for attempt in 1 2 3; do
            if out="$(npm audit --omit=dev --audit-level=high 2>&1)"; then
              echo "$out"
              exit 0
            fi
            if echo "$out" | grep -qiE "$unreachable"; then
              echo "::warning::npm advisory endpoint unreachable (attempt $attempt of 3) — retrying"
              sleep $((attempt * 15))
              continue
            fi
            # Anything else is the audit doing its job.
            echo "$out"
            exit 1
          done
          echo "$out"
          echo "::error::Could not reach npm's advisory endpoint after 3 attempts. That is a registry outage, not a clean audit — re-run when it is back."
          exit 1

      # Dev-only advisories shouldn't block a deploy, but shouldn't be silent.
      - name: Dependency audit (all, advisory)
        run: npm audit --audit-level=moderate || true

      - name: Build
        run: npm run build
        env:
          # The build must not need real credentials. If this starts failing,
          # something began reaching for a secret at module load — the bug
          # already fixed twice, in the database client and the Anthropic client.
          SKIP_ENV_VALIDATION: "1"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A committed key is the failure that matters most here: it would be
      # someone else's bill and her data.
      - name: Scan history for credentials
        run: |
          # .env.example is excluded: it exists to carry placeholders, and
          # "user:password@host" is documentation, not a leak.
          if git log -p --all -- . ':(exclude).env.example' \
             | grep -vE 'user:password|USER:PASSWORD|<[^>]+>|\.\.\.' \
             | grep -nE 'sk-ant-api[0-9a-zA-Z_-]{20}|npg_[A-Za-z0-9]{16}|postgres(ql)?://[a-z_]+:[A-Za-z0-9]{12}' ; then
            echo "::error::Credential-shaped string found in git history"
            exit 1
          fi
          echo "No credentials found in history."

      - name: .env must be ignored
        run: |
          git check-ignore -q .env.example && { echo "::error::.env.example must NOT be ignored"; exit 1; }
          printf 'ANTHROPIC_API_KEY=sk-ant-test\n' > .env
          git check-ignore -q .env || { echo "::error::.env is not gitignored"; exit 1; }
          rm -f .env
          echo ".env ignored, .env.example tracked."

  # Nothing reaches her app that the two jobs above haven't passed. `needs`
  # is the whole point: a red typecheck, lint, test, audit, build or secret
  # scan means this job never starts, and production keeps serving the last
  # good deploy.
  # Can a deploy happen at all? A secret is not readable from a job-level
  # `if:`, so the question has to be answered in a step and passed on as an
  # output. This exists so that a missing token SKIPS the deploy rather than
  # failing it: without a token there is nothing to deploy, and a red build on
  # every push turns out to be 21 emails in a night rather than a useful
  # signal. The skip is still stated loudly in the run summary.
  deploy-gate:
    needs: [verify, secrets]
    # Pushes to main only. This repo is public, so a fork's pull request must
    # never be able to reach the deploy token — `pull_request` from a fork
    # can't satisfy this condition, and the token is not in scope for any
    # other job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token: ${{ steps.check.outputs.token }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "token=yes" >> "$GITHUB_OUTPUT"
          else
            echo "token=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::VERCEL_TOKEN is not set, so this push was not deployed."
            {
              echo "### Deploy skipped"
              echo
              echo 'No `VERCEL_TOKEN` secret, so this push was **not deployed**.'
              echo
              echo 'Create one at <https://vercel.com/account/tokens>, scoped to this project, then:'
              echo
              echo '```'
              echo 'gh secret set VERCEL_TOKEN'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [verify, secrets, deploy-gate]
    # Skipped, not failed, when there is no token to deploy with.
    if: needs.deploy-gate.outputs.token == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two pushes in quick succession would otherwise race, and the loser could
    # land last and overwrite the newer build. Queue instead of cancelling:
    # a half-finished deploy is worse than a slow one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Vercel builds this itself rather than us running `vercel build` here.
      # The prebuilt route needs `vercel pull`, which downloads the production
      # environment — the real database URL and API key — onto the runner. It
      # costs about thirty seconds to let Vercel build it, and those secrets
      # never leave Vercel.
      - name: Deploy to production
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Identifiers, not credentials: they name the project the token is
          # allowed to touch, and are useless without it.
          VERCEL_ORG_ID: team_DTv0u4ESbVaRPY4WbeKJ8sED
          VERCEL_PROJECT_ID: prj_WVxML4XZ4qhFLDLmjZunPAU6TD4u
