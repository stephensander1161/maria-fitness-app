name: CI

# The pipeline. Every push to dev or main, and every pull request into main,
# runs the same gates a ship ran on a laptop until 2026-09-18: typecheck, lint,
# the unit *and* database suites, a dependency audit, the build, and the
# browser journeys against a real Postgres. Then:
#
#   push to dev   → deploy a preview and point maria-fitness-app-dev at it
#   merge to main → deploy production
#
# main takes no direct pushes (a repository ruleset: pull requests only, these
# checks required, and `from-dev` below refuses any pull request whose head is
# not dev). So the only road to production is dev → the gates → a merge, which
# is what `npm run promote` does. A laptop can still run the gates first for
# fast feedback (`npm run ship:dev`, `npm run ship`), but nothing a laptop does
# reaches an environment any more.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Dependencies rot even when the code doesn't — catch a new advisory in a
  # package we already shipped.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner's clock is her zone, as the laptop's is. The suites build
      # dates with `new Date(y, m, d)` — local time — and compare them to
      # dates the app computes in APP_TIMEZONE; on a UTC clock "Jan 5 at
      # midnight" is Jan 4 in Edmonton, and the first run failed on exactly
      # that. Two clocks, one zone.
      TZ: America/Edmonton
    services:
      # The database the db suite and the browser journeys run against — the
      # same shape as the local plate_test, thrown away with the runner.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the development runtime: npm 10 and npm 11 resolve optional
          # platform dependencies differently, and a lockfile written by one
          # fails `npm ci` under the other.
          node-version: 24
          cache: npm

      # `ci` not `install`: installs exactly the locked tree, and fails if the
      # lockfile and manifest disagree.
      - run: npm ci

      # What .env.test is on a laptop (scripts/env-test.sh): the runner's
      # Postgres, and placeholders for everything else. Nothing here is real;
      # the suites never call Anthropic, and this job proves it stays that way.
      - name: Test environment
        run: |
          {
            echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/plate_test"
            echo "DATABASE_URL_DIRECT=postgres://postgres:postgres@localhost:5432/plate_test"
            echo "ANTHROPIC_API_KEY=ci-placeholder-not-a-key"
            echo "AUTH_SECRET=ci-only-session-signing-value"
            echo "APP_TIMEZONE=America/Edmonton"
          } > .env.test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test database
        run: npm run db:push:test && npm run db:seed:test

      # Unit and database suites, with the coverage floor.
      - name: Tests
        run: npm run coverage

      - name: Dependency audit (production)
        # npm's advisory endpoint is flaky, and it used to take the whole
        # pipeline down with it: two runs in one evening failed here, one on
        # ECONNRESET and one on a read timeout, neither a vulnerability. A gate
        # that goes red for reasons unrelated to the change is a gate people
        # learn to ignore, which costs more than the flake does.
        #
        # Retrying alone made it worse — npm waits five minutes before giving
        # up, so three attempts blew the job's ten-minute limit and the run was
        # cancelled instead of failing. So each attempt is bounded twice: npm's
        # own fetch timeout, and `timeout` around it in case npm ignores its
        # own. Worst case is about three minutes, not fifteen.
        #
        # A real finding still fails on the first attempt. Only the handful of
        # errors that mean "could not ask" are retried, and an unreachable
        # endpoint is never allowed to read as a clean audit.
        run: |
          unreachable='ECONNRESET|network timeout|audit endpoint returned an error|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|socket hang up|request to .* failed'
          for attempt in 1 2 3; do
            code=0
            out="$(timeout 75 npm audit --omit=dev --audit-level=high --fetch-timeout=30000 2>&1)" || code=$?
            if [ "$code" -eq 0 ]; then
              echo "$out"
              exit 0
            fi
            # 124 is `timeout` killing it, which is the same problem by
            # another name.
            if [ "$code" -eq 124 ] || echo "$out" | grep -qiE "$unreachable"; then
              echo "::warning::npm advisory endpoint unreachable (attempt $attempt of 3)"
              sleep $((attempt * 10))
              continue
            fi
            # Anything else is the audit doing its job.
            echo "$out"
            exit 1
          done
          echo "$out"
          echo "::error::Could not reach npm's advisory endpoint after 3 bounded attempts. That is a registry outage, not a clean audit — re-run when it is back."
          exit 1

      - name: Dependency audit (all, advisory)
        run: timeout 75 npm audit --audit-level=moderate --fetch-timeout=30000 || true

      - name: Build
        run: npm run build
        env:
          # The build must not need real credentials. If this starts failing,
          # something began reaching for a secret at module load — the bug
          # already fixed twice, in the database client and the Anthropic client.
          SKIP_ENV_VALIDATION: "1"

      # The browser journeys, phone and desktop, against the build above and
      # the runner's Postgres. Chromium only: that is what the config drives.
      - name: Browsers
        run: npx playwright install --with-deps chromium

      - name: Journeys
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A committed key is the failure that matters most here: it would be
      # someone else's bill and her data.
      - name: Scan history for credentials
        run: |
          # .env.example is excluded: it exists to carry placeholders, and
          # "user:password@host" is documentation, not a leak. So is the
          # runner's own throwaway Postgres above.
          if git log -p --all -- . ':(exclude).env.example' \
             | grep -vE 'user:password|USER:PASSWORD|<[^>]+>|\.\.\.|postgres:postgres@localhost' \
             | grep -nE 'sk-ant-api[0-9a-zA-Z_-]{20}|npg_[A-Za-z0-9]{16}|postgres(ql)?://[a-z_]+:[A-Za-z0-9]{12}' ; then
            echo "::error::Credential-shaped string found in git history"
            exit 1
          fi
          echo "No credentials found in history."

      - name: .env must be ignored
        run: |
          git check-ignore -q .env.example && { echo "::error::.env.example must NOT be ignored"; exit 1; }
          printf 'ANTHROPIC_API_KEY=placeholder\n' > .env
          git check-ignore -q .env || { echo "::error::.env is not gitignored"; exit 1; }
          rm -f .env
          echo ".env ignored, .env.example tracked."

  # dev gates production. A pull request into main from any branch but dev
  # fails here, and this check is required by main's ruleset — so a change
  # cannot reach production without first having been on dev, whoever opens
  # the pull request and however green it is.
  from-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          if [ "${{ github.head_ref }}" = "dev" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "Pull request is from dev — the only road to main."
          else
            echo "::error::main is promoted from dev, not merged from '${{ github.head_ref }}'. Land the change on dev and run: npm run promote"
            exit 1
          fi

  # Can a deploy happen at all? A secret is not readable from a job-level
  # `if:`, so the question has to be answered in a step and passed on as an
  # output. A missing token SKIPS the deploy rather than failing it, and says
  # so in the run summary: without a token there is nothing to deploy with.
  deploy-gate:
    needs: [verify, secrets]
    # Pushes only. This repo is public, so a fork's pull request must never be
    # able to reach the deploy token — `pull_request` can't satisfy this
    # condition, and the token is not in scope for any other job.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token: ${{ steps.check.outputs.token }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "token=yes" >> "$GITHUB_OUTPUT"
          else
            echo "token=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::VERCEL_TOKEN is not set, so this push was not deployed."
            {
              echo "### Deploy skipped"
              echo
              echo 'No `VERCEL_TOKEN` secret, so this push was **not deployed**.'
              echo
              echo 'Create one at <https://vercel.com/account/settings/tokens>, scoped to the fitness-app18 team, then:'
              echo
              echo '```'
              echo 'gh secret set VERCEL_TOKEN'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The dev environment: a preview deployment, reading the project's Preview
  # variables (its own database, its own session secret, no Blob store, no
  # crons), then the fixed dev address is pointed at it.
  deploy-dev:
    needs: [verify, secrets, deploy-gate]
    if: needs.deploy-gate.outputs.token == 'yes' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Identifiers, not credentials: they name the project the token is
      # allowed to touch, and are useless without it.
      VERCEL_ORG_ID: team_DTv0u4ESbVaRPY4WbeKJ8sED
      VERCEL_PROJECT_ID: prj_WVxML4XZ4qhFLDLmjZunPAU6TD4u
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Vercel builds it; nothing from the Preview environment lands here.
      - name: Deploy preview
        id: deploy
        run: |
          url="$(npx vercel deploy --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"
      # Through the API, not the CLI. A team-scoped token has no user behind
      # it, and `vercel alias set` insists on loading one ("User not found",
      # with or without --scope); the deploy above works because the project
      # ids name the team. The API takes the team by id and asks for nothing
      # else — the deployment is looked up by its hostname, then aliased.
      - name: Point the dev address at it
        run: |
          host="${{ steps.deploy.outputs.url }}"; host="${host#https://}"
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          id="$(curl -sfS "${auth[@]}" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r .id)"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::could not find deployment $host"; exit 1; }
          curl -sfS -X POST "${auth[@]}" -H "Content-Type: application/json" \
            "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" \
            -d '{"alias":"maria-fitness-app-dev.vercel.app"}' | jq -r '"aliased: " + (.alias // .error.message)'
      - run: |
          echo "### Dev deployed" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "https://maria-fitness-app-dev.vercel.app → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  # Production. Only a merge into main gets here, and main only takes merges
  # from dev that passed the jobs above.
  deploy:
    needs: [verify, secrets, deploy-gate]
    if: needs.deploy-gate.outputs.token == 'yes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two merges in quick succession would otherwise race, and the loser could
    # land last and overwrite the newer build. Queue instead of cancelling:
    # a half-finished deploy is worse than a slow one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_DTv0u4ESbVaRPY4WbeKJ8sED
      VERCEL_PROJECT_ID: prj_WVxML4XZ4qhFLDLmjZunPAU6TD4u
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Vercel builds this itself rather than us running `vercel build` here.
      # The prebuilt route needs `vercel pull`, which downloads the production
      # environment — the real database URL and API key — onto the runner. It
      # costs about thirty seconds to let Vercel build it, and those secrets
      # never leave Vercel. (The same is why the schema is pushed from the
      # laptop by `npm run promote`, before the pull request is opened.)
      - name: Deploy to production
        id: deploy
        run: |
          url="$(npx vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url"
      # Every retained deployment keeps its own copy of the function bundles,
      # and the free tier's 10GB is the sum of all of them. `--safe` never
      # touches the ones that are live.
      # Hygiene, not the deploy: the CLI's ls/remove want a user behind the
      # token as well, so this may not work with a team token. It must never
      # fail a deploy that has already gone out; `npm run prune` from a
      # laptop does the same job.
      - name: Prune old deployments
        continue-on-error: true
        run: bash scripts/prune-deployments.sh
      - run: |
          echo "### Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "https://maria-fitness-app.vercel.app → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
